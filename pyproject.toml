[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxora"
version = "0.1"
description = "CPU-only REST API service for ASR/TTS with eight interchangeable engines, per-request RTF telemetry, and reproducible benchmark tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Voxora contributors" }]
keywords = [
  "speech-recognition", "text-to-speech", "api", "rest", "cpu-inference",
  "onnx", "sherpa-onnx", "piper", "qwen3-asr", "sensevoice", "cosyvoice",
  "benchmark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "soundfile>=0.12",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Default ONNX-only engines (no PyTorch required).
onnx = ["sherpa-onnx>=1.12", "piper-tts>=1.3"]
# PyTorch-backed research engines (heavy; see docs/REPRODUCING.md for tested pins).
torch = [
  "torch>=2.10",
  "qwen-asr>=0.0.6",
  "qwen-tts>=0.1.1",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "httpx>=0.27",
]

[project.scripts]
voxora-api = "voxora.api.__main__:main"
voxora = "voxora.bench.__main__:main"

[project.urls]
Homepage = "https://github.com/fly88oj/voxora"
Documentation = "https://github.com/fly88oj/voxora/tree/main/docs"
Issues = "https://github.com/fly88oj/voxora/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voxora"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires real model weights (set VOXORA_INTEGRATION_MODELS to enable)",
]
addopts = "-q"

[tool.coverage.run]
source = ["src/voxora"]
